<style>
:root{--t:#4ee6e0;--tb:#e6faf9;--ink:#0d2a2f;--mut:#6b7f83;--bd:#dcecec}

button,input,select,textarea{font:inherit}input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;margin:5px 0;background:#fff}
.btn{background:var(--t);color:var(--ink);border:0;border-radius:99px;padding:10px 18px;font-weight:600;cursor:pointer}.btn.dk{background:var(--ink);color:#fff}.btn.sm{padding:7px 14px;font-size:13px}

#auth{min-height:100vh;display:grid;place-items:center;padding:20px}.ac{background:#fff;border-radius:22px;padding:32px;width:100%;max-width:400px;border:1px solid var(--bd)}
.logo{font-size:30px;font-weight:700;line-height:1}.logo small{display:block;background:var(--t);color:#fff;font-size:12px;font-weight:500;padding:3px 10px;border-radius:8px;width:fit-content;margin-top:4px}

aside{padding:22px 16px;border-right:1px solid var(--bd);background:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
aside a{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer}aside a.on{background:var(--t)}
.tag{font-family:Caveat,cursive;font-size:30px;line-height:1.05;margin-top:auto;transform:rotate(-8deg);color:var(--ink)}
main{padding:18px 24px;min-width:0}.top{display:flex;gap:16px;align-items:center;margin-bottom:16px}.top input{border-radius:99px;margin:0;flex:1}
.who{display:flex;gap:8px;align-items:center;font-weight:600;white-space:nowrap}.av{width:38px;height:38px;border-radius:50%;background:var(--t);display:grid;place-items:center}
.news{background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap}.news b{background:var(--t);color:var(--ink);border-radius:99px;padding:0 10px}
.grid{display:grid;grid-template-columns:1.9fr 1fr;gap:18px}.hero{background:linear-gradient(120deg,var(--tb),#c9f5f2);border-radius:20px;padding:28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}

.stats{display:grid;gap:14px}.stat{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:14px 18px}.stat b{font-size:30px;display:block}.stat span{color:var(--mut);font-size:13px}
.sec{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:18px}.sec h3{margin:0 0 14px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{border:1px solid var(--bd);border-radius:16px;padding:12px}

.card small,.mut{color:var(--mut);font-size:12px}.card .btn{width:100%;margin-top:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}.row .g{flex:1;min-width:0}
.lg{width:44px;height:44px;border-radius:12px;background:var(--tb);object-fit:contain;display:grid;place-items:center;font-weight:700}
.pill{background:var(--tb);border-radius:99px;padding:2px 12px;font-size:12px}.bar{height:8px;background:#e8f1f1;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--t)}
.foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.foot a{background:var(--tb);border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);font-weight:600;text-align:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:8px 18px;cursor:pointer}.tabs .on{background:var(--t);border-color:var(--t);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px;border-top:1px solid var(--bd);text-align:left;vertical-align:top}

@media(max-width:900px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.tag{display:none}.grid{grid-template-columns:1fr}}

function authView(m='login'){

async function login(){const{error}=await sb.auth.signInWithPassword({email:v('e'),password:$('#p').value});error?toast(error.message):boot()}
async function signup(){
 const{data,error}=await sb.auth.signUp({email:v('e'),password:$('#p').value,options:{data:{name:v('n'),college:v('c'),course:v('co'),phone:v('ph')}}});
 if(error)return toast(error.message);data.session?boot():(toast('Check your email to confirm, then log in'),authView('login'))}
async function sendOtp(){resetEmail=v('e');const{error}=await sb.auth.resetPasswordForEmail(resetEmail);error?toast(error.message):(toast('Code sent'),authView('reset'))}
async function doReset(){
 let r=await sb.auth.verifyOtp({email:resetEmail,token:v('o'),type:'recovery'});if(r.error)return toast(r.error.message);
 r=await sb.auth.updateUser({password:$('#p').value});r.error?toast(r.error.message):(toast('Password updated'),boot())}
const logout=async()=>{await sb.auth.signOut();authView()};

async function boot(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return authView();
 const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=p;if(me.status&&me.status!=='active'){await sb.auth.signOut();authView();return toast(me.status==='banned'?'This account has been permanently banned.':'Your account is blocked. Please contact SkillZea.')}
 $('#auth').hidden=true;$('#app').hidden=false;me.role==='admin'?adminView():studentView();
}
const pub=async f=>{if(!f)return null;const p=Date.now()+'_'+f.name.replace(/[^\w.-]+/g,'_');const{error}=await sb.storage.from('public').upload(p,f);if(error){toast(error.message);return null}return sb.storage.from('public').getPublicUrl(p).data.publicUrl};

/* ---------- STUDENT ---------- */
async function studentView(){
 const q=(t,o)=>sb.from(t).select(o||'*').order('created_at',{ascending:false});
 const[a,b,c,d,e]=await Promise.all([q('opportunities'),q('batches'),q('updates').limit(3),q('cvs'),q('applications','*,opportunities(title,company),cvs(name)')]);
 D={opps:a.data||[],batches:b.data||[],ups:c.data||[],cvs:(d.data||[]).filter(x=>x.user_id===me.id),apps:e.data||[]};
 $('#app').innerHTML=`<aside>${LOGO}<br>
 <a class=on href="#top">🏠 Dashboard</a><a href="#batches">📖 Batches</a><a href="#opps">💼 Internships</a><a href="#cvs">📄 My CVs & ATS</a><a href="#apps">✅ Applications</a><a href="#about">ℹ️ About & Contact</a><a onclick=logout()>↩ Log out</a>
 <div class=tag>Better Skills<br>Bigger Dreams</div></aside>
 <main id=top><div class=top><input placeholder="Search courses, batches, internships..." oninput="find(this.value)"><div class=who><div class=av>${ini(me.name)}</div>${esc(me.name)}</div></div>
 ${D.ups.length?`<div class=news><b>New</b>${D.ups.map(u=>`<span>${esc(u.text)}</span>`).join(' • ')}</div>`:''}
 <div class=grid><div>
  <div class=hero><div><h1>${new Date().getHours()<12?'Good morning':new Date().getHours()<17?'Good afternoon':'Good evening'}, ${esc(me.name.split(' ')[0])}!<br>Keep going!</h1><p>Every course, every step, brings you closer to your bigger dreams.</p></div><div class=em>👩‍💻</div></div>
  <div class=sec id=batches><h3>Upcoming Batches</h3><div class=cards id=bl>${D.batches.map(batchCard).join('')||'<p class=mut>No batch announced yet. Check back soon!</p>'}</div></div>
  <div class=sec id=opps><h3>Available Internships & Opportunities</h3><div class=tabs>${['All','Paid','Stipend','Unpaid'].map(x=>`<button class="${x==='All'?'on':''}" onclick="setF('${x}',this)">${x}</button>`).join('')}</div><div id=ol>${oppList()}</div></div>
 </div><div>
  <div class=stats style="grid-template-columns:repeat(2,1fr);margin-bottom:18px"><div class=stat><span>✅ Applied</span><b>${D.apps.length}</b></div><div class=stat><span>📄 My CVs</span><b>${D.cvs.length}</b></div><div class=stat><span>📖 Batches</span><b>${D.batches.length}</b></div><div class=stat><span>⭐ Best ATS</span><b>${Math.max(0,...D.cvs.map(c=>c.ats_score||0))||'--'}</b></div></div>
  <div class=sec id=cvs><h3>My CVs</h3>
   <input type=file id=cvf accept=".pdf,.doc,.docx"><button class="btn sm" onclick=upCv()>Upload CV</button>
   <div style="margin-top:10px">${D.cvs.map(cvRow).join('')||'<p class=mut>Upload your CV (PDF works best for ATS score).</p>'}</div></div>
  <div class=sec id=apps><h3>My Applications</h3>${D.apps.map(x=>`<div class=row><div class=g><b>${esc(x.opportunities?.title)}</b><br><small class=mut>${esc(x.opportunities?.company)} • CV: ${esc(x.cvs?.name||'deleted CV')} • ${new Date(x.created_at).toLocaleDateString()}</small></div></div>`).join('')||'<p class=mut>You haven\'t applied yet.</p>'}</div>
 </div></div>
 <div class=sec id=about><h3>About, Contact & Community</h3><div class=foot>
  <a href="mailto:contact@skillzea.com">📧 Contact us</a><a href="#about" onclick="toast('SkillZea: Evolve. Learn. Conquer.')">ℹ️ About us</a>
  <a target=_blank rel=noopener href="${LINKS.li}">💼 Our LinkedIn page</a><a target=_blank rel=noopener href="${LINKS.ig}">📸 Instagram page</a><a target=_blank rel=noopener href="${LINKS.wa}">💬 WhatsApp community</a></div></div></main>`;
}
const batchCard=b=>`<div class=card><div class=ban>${esc(b.course_name)}</div><b>${esc(b.course_name)}</b><br><small>Mentor: ${esc(b.mentor_name)}</small><br><small>${esc(b.duration)} • ₹${esc(b.price)}${b.start_date?' • Starts '+esc(b.start_date):''}</small><p class=mut>${esc(b.mentor_about)}</p>${b.mentor_cv_url?`<a class=lnk target=_blank href="${esc(b.mentor_cv_url)}">Mentor CV</a>`:''}<button class=btn onclick="window.open('${esc(b.form_link)}','_blank')">Enroll now</button></div>`;
const oppRow=o=>{const ap=(D.apps||[]).some(x=>x.opportunity_id===o.id);return `<div class=row><div class=lg>${o.logo_url?`<img class=lg src="${esc(o.logo_url)}">`:ini(o.company)}</div><div class=g><b>${esc(o.title)}</b>${(Date.now()-new Date(o.created_at))<6048e5?' <span class=pill style="background:var(--t)">New</span>':''}<br><small class=mut>${esc(o.company)} • ${esc(o.location)}</small></div><span class=mut>${esc(o.duration)}</span><span class=pill>${esc(o.pay_type)}</span>${ap?`<button class="btn sm dk" disabled style="opacity:.75;cursor:default">Applied ✓</button>`:`<button class="btn sm" onclick="applyOpen('${o.id}')">Apply Now</button>`}</div>`};
const cvRow=c=>`<div class=row><div class=g><a class=lnk onclick="openCv('${esc(c.path)}')">${esc(c.name)}</a>${c.ats_score!=null?`<div class=bar><i style="width:${c.ats_score}%;background:${c.ats_score>=70?'#2bc48a':c.ats_score>=50?'#f5b83d':'#ef6b6b'}"></i></div><small class=mut>ATS score: <b>${c.ats_score}/100</b></small><br><small class=mut>${esc(c.ats_feedback)}</small>`:''}</div><button class="btn sm dk" onclick="ats('${c.id}',this)">ATS score</button><button class="btn sm" onclick="delCv('${c.id}')">Delete</button></div>`;
let F='All';
const oppList=(t='')=>{t=t.toLowerCase();const ap=o=>D.apps.some(x=>x.opportunity_id===o.id);return D.opps.filter(o=>(F==='All'||o.pay_type===F)&&(o.title+o.company).toLowerCase().includes(t)).sort((a,b)=>ap(a)-ap(b)).map(oppRow).join('')||'<p class=mut>No opportunities found.</p>'};
function setF(x,b){F=x;b.parentNode.querySelectorAll('button').forEach(y=>y.classList.remove('on'));b.classList.add('on');$('#ol').innerHTML=oppList()}
function find(t){t=t.toLowerCase();$('#ol').innerHTML=oppList(t);$('#bl').innerHTML=D.batches.filter(b=>(b.course_name+b.mentor_name).toLowerCase().includes(t)).map(batchCard).join('')}
async function upCv(){
 const f=$('#cvf').files[0];if(!f)return toast('Choose a file first');
 const path=`${me.id}/${Date.now()}_${f.name.replace(/[^\w.-]+/g,'_')}`;
 let r=await sb.storage.from('cvs').upload(path,f);if(r.error)return toast(r.error.message);
 r=await sb.from('cvs').insert({user_id:me.id,name:f.name,path});r.error?toast(r.error.message):(toast('CV uploaded'),studentView())}
function applyOpen(id){
 const o=D.opps.find(x=>x.id===id);if(D.apps.some(x=>x.opportunity_id===id))return toast('You have already applied here');if(!D.cvs.length)return toast('Upload a CV first');
 const m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div><h3>Apply: ${esc(o.title)}</h3><p class=mut>${esc(o.company)}</p><select id=pick>${D.cvs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><p class=mut>Your CV will be saved here, then you'll go to the company's form to finish applying.</p><button class=btn id=go>Continue</button> <button class="btn dk" onclick="this.closest('.mod').remove()">Cancel</button></div>`;
 document.body.append(m);
 $('#go').onclick=async()=>{const w=window.open('','_blank');
  const{error}=await sb.from('applications').insert({user_id:me.id,opportunity_id:id,cv_id:$('#pick').value});
  if(error){w.close();return toast(error.message)}w.location=o.apply_link;m.remove();studentView()}}
const SK='communication|teamwork|leadership|excel|word|powerpoint|ms office|python|java|sql|html|css|javascript|canva|photoshop|seo|content writing|copywriting|social media|marketing|research|analysis|analytics|public speaking|management|problem solving|time management|google sheets|data analysis|presentation|editing|design|figma|react|power bi|tableau|customer service|negotiation|event|project management'.split('|');
const AV='led|built|managed|created|designed|developed|organized|organised|launched|improved|increased|analyzed|analysed|coordinated|conducted|delivered|implemented|wrote|achieved|initiated|trained|presented|researched|supported|handled|planned|executed'.split('|');
function scoreCv(t){
 const L=t.toLowerCase(),has=r=>r.test(L),cnt=l=>l.filter(k=>new RegExp('\\b'+k+'\\b').test(L)).length,sc=(n,full,max)=>Math.round(Math.min(n/full,1)*max);
 const words=L.split(/\s+/).filter(Boolean).length,miss=[];let s=0;
 const add=(ok,pts,msg)=>{if(ok)s+=pts;else miss.push(msg)};
 add(/[\w.+-]+@[\w-]+\.[\w.]+/.test(L),6,'email');
 add(/\+?\d[\d\s-]{8,}\d/.test(L),5,'phone number');
 add(/linkedin|github|portfolio/.test(L),4,'LinkedIn/portfolio link');
 add(has(/education|academic|qualification/),6,'Education section');
 add(has(/skills|competenc/),6,'Skills section');
 add(has(/experience|internship|employment/),7,'Experience/Internship section');
 add(has(/projects?|achievements?/),6,'Projects section');
 const k=cnt(SK);s+=sc(k,8,15);if(k<8)miss.push('more relevant skills');
 const n=(t.match(/\d+\s?%|\b\d{2,}\b/g)||[]).length;s+=sc(n,8,15);if(n<8)miss.push('numbers/results');
 const v=cnt(AV);s+=sc(v,6,10);if(v<6)miss.push('action verbs');
 s+=words>=250&&words<=900?10:words>=150&&words<=1200?6:2;if(words<250||words>900)miss.push(words<250?'more detail':'shorter length');
 const b=(t.match(/[•●▪◦‣]/g)||[]).length;s+=sc(b,8,10);if(b<8)miss.push('bullet points');
 return{score:Math.min(100,s),tips:miss.length?'Improve: '+miss.slice(0,4).join(', '):'Well structured'};
}
async function delCv(id){const c=D.cvs.find(x=>x.id===id);if(!confirm('Delete this CV? This cannot be undone.'))return;
 const{error}=await sb.from('cvs').delete().eq('id',id);if(error)return toast(error.message);
 await sb.storage.from('cvs').remove([c.path]);toast('CV deleted');studentView()}
async function pdfText(blob){const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;let t='';for(let i=1;i<=Math.min(pdf.numPages,5);i++){t+=(await(await pdf.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')+'\n'}return t}
async function ats(id,btn){
 const c=D.cvs.find(x=>x.id===id);if(!c.name.toLowerCase().endsWith('.pdf'))return toast('ATS score works with PDF files');
 btn.textContent='Analysing...';btn.disabled=true;
 try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const{data}=await sb.storage.from('cvs').download(c.path);const text=await pdfText(data);
  if(text.trim().length<50)throw Error('No readable text found. Scanned/image CVs fail ATS too!');
  const j=scoreCv(text);
  await sb.from('cvs').update({ats_score:j.score,ats_feedback:j.tips}).eq('id',id);studentView()
 }catch(e){toast(e.message);btn.textContent='ATS score';btn.disabled=false}}

let A={};
const st=(n,l,i)=>`<div class=stat><span>${i} ${l}</span><b>${n}</b></div>`;
const U=id=>A.p.find(x=>x.id===id)||{};
const cvLink=c=>c?`<a class=lnk onclick="openCv('${esc(c.path)}')">${esc(c.name)}</a>`:'<span class=mut>deleted</span>';
async function adminView(t='ov'){
 $('#app').style.display='';
 const q=(x,o)=>sb.from(x).select(o||'*').order('created_at',{ascending:false});
 const[p,c,a,o,b,u]=await Promise.all([sb.from('profiles').select('*').neq('role','admin').order('name'),q('cvs'),q('applications','*,opportunities(title,company),cvs(name,path)'),q('opportunities'),q('batches'),q('updates')]);
 A={p:p.data||[],c:c.data||[],a:a.data||[],o:o.data||[],b:b.data||[],u:u.data||[]};
 $('#app').innerHTML=`<aside>${LOGO}<br>${Object.entries(tabs).map(([k,[i,n]])=>`<a class="${k===t?'on':''}" onclick="adminView('${k}')">${i} ${n}</a>`).join('')}<a onclick=logout()>↩ Log out</a></aside><main><div class=top><h2 style="margin:0;flex:1">${tabs[t][1]}</h2><span class=pill>Admin</span></div><div id=ab></div></main>`;
 const B=$('#ab');
 if(t==='ov'){
  const cnt=A.o.map(x=>({x,n:A.a.filter(y=>y.opportunity_id===x.id).length})).sort((m,n)=>n.n-m.n).slice(0,5),mx=Math.max(1,...cnt.map(y=>y.n));
  B.innerHTML=`<div class=stats style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px">${st(A.p.length,'Students','👥')}${st(A.c.length,'CVs uploaded','📄')}${st(A.a.length,'Applications','✅')}${st(A.o.length,'Opportunities','💼')}${st(A.b.length,'Courses','📖')}</div>
  <div class=grid style="grid-template-columns:1fr 1fr"><div class=sec><h3>Top opportunities</h3>${cnt.map(y=>`<div class=row><div class=g><b>${esc(y.x.title)}</b> <small class=mut>${esc(y.x.company)}</small><div class=bar><i style="width:${y.n/mx*100}%"></i></div></div><span class=pill>${y.n} applied</span></div>`).join('')||'<p class=mut>Nothing yet.</p>'}</div>
  <div class=sec><h3>Recent applications</h3>${A.a.slice(0,6).map(y=>`<div class=row><div class=g><b>${esc(U(y.user_id).name)}</b> → ${esc(y.opportunities?.title)}<br><small class=mut>${esc(y.opportunities?.company)} • ${new Date(y.created_at).toLocaleDateString()}</small></div></div>`).join('')||'<p class=mut>Nothing yet.</p>'}</div></div>`}
 if(t==='users'){
  B.innerHTML=`<div class=sec><div style="display:flex;gap:10px;margin-bottom:10px"><input id=sq placeholder="Search by name, college, course, phone or email..." oninput="userRows(this.value)" style="margin:0"><button class="btn dk" style="white-space:nowrap" onclick="exportCsv()">⬇ Export CSV</button></div><div style="overflow:auto"><table><thead><tr><th>Student</th><th>College / Course</th><th>Contact</th><th>CVs (ATS)</th><th>Applied to</th><th>Status / Action</th></tr></thead><tbody id=ur></tbody></table></div></div>`;userRows('')}
 if(t==='apps'){
  B.innerHTML=`<div class=sec style="overflow:auto"><table><tr><th>Student</th><th>College</th><th>Opportunity</th><th>CV used</th><th>Date</th></tr>${A.a.map(y=>{const s=U(y.user_id);return `<tr><td><b>${esc(s.name)}</b><br><small class=mut>${esc(s.phone)}</small></td><td>${esc(s.college)}</td><td>${esc(y.opportunities?.title)}<br><small class=mut>${esc(y.opportunities?.company)}</small></td><td>${cvLink(y.cvs)}</td><td>${new Date(y.created_at).toLocaleDateString()}</td></tr>`}).join('')}</table></div>`}
 if(t==='opps'){
  B.innerHTML=`<div class=sec><h3>Add opportunity</h3><input id=ti placeholder="Title (e.g. Content Intern)"><input id=co placeholder="Company name"><input id=lo placeholder="Location (Remote / City)"><input id=du placeholder="Duration (e.g. 3 Months)"><select id=pt><option>Paid</option><option>Stipend</option><option>Unpaid</option></select><label class=mut>Company logo</label><input type=file id=lg accept="image/*"><input id=al placeholder="Apply link (company form or website)"><button class=btn onclick="addOpp()">Publish opportunity</button></div><div class=sec><h3>Live opportunities</h3>${A.o.map(x=>`<div class=row><div class=lg>${x.logo_url?`<img class=lg src="${esc(x.logo_url)}">`:ini(x.company)}</div><div class=g><b>${esc(x.title)}</b><br><small class=mut>${esc(x.company)} • ${esc(x.duration)} • ${esc(x.pay_type)}</small></div><span class=pill>${A.a.filter(y=>y.opportunity_id===x.id).length} applied</span><button class="btn sm dk" onclick="del('opportunities','${x.id}','opps')">Delete</button></div>`).join('')||'<p class=mut>None yet.</p>'}</div>`}
 if(t==='batches'){
  B.innerHTML=`<div class=sec><h3>List a course</h3><input id=cn placeholder="Course name"><input id=mn placeholder="Mentor name"><textarea id=ma placeholder="About the mentor"></textarea><label class=mut>Mentor CV</label><input type=file id=mc><input id=cd placeholder="Course duration (e.g. 6 weeks)"><input id=cp placeholder="Price in ₹"><label class=mut>Start date</label><input type=date id=sd><input id=fl placeholder="Response form link"><button class=btn onclick="addBatch()">Publish course</button></div><div class=sec><h3>Live courses</h3><div class=cards>${A.b.map(x=>batchCard(x).replace(/<button.*<\/button>/,`<button class="btn dk" onclick="del('batches','${x.id}','batches')">Delete</button>`)).join('')||'<p class=mut>None yet.</p>'}</div></div>`}
 if(t==='ups'){
  B.innerHTML=`<div class=sec><h3>Post an update</h3><input id=ut placeholder="e.g. New batch: Digital Marketing starts 1 Nov!"><button class=btn onclick="addUp()">Post to all students</button></div><div class=sec>${A.u.map(x=>`<div class=row><div class=g>${esc(x.text)}<br><small class=mut>${new Date(x.created_at).toLocaleDateString()}</small></div><button class="btn sm dk" onclick="del('updates','${x.id}','ups')">Delete</button></div>`).join('')||'<p class=mut>None yet.</p>'}</div>`}
}
const statusCell=s=>{const st=s.status||'active';return `<span class=pill>${st}</span><br>`+(st==='banned'?'':`${st==='blocked'?`<a class=lnk onclick="setStatus('${s.id}','active')">Unblock</a> `:`<a class=lnk onclick="setStatus('${s.id}','blocked')">Block</a> `}<a class=lnk style="color:#d33" onclick="setStatus('${s.id}','banned')">Ban</a>`)};
async function setStatus(id,st){const s=U(id),word=st==='banned'?'BAN':'BLOCK';
 if(st==='active'){if(!confirm('Unblock '+s.name+'?'))return}
 else{
  if(!confirm((st==='banned'?'PERMANENTLY BAN ':'BLOCK ')+s.name+'?'))return;
  if(!confirm('Second check: '+s.email+(st==='banned'?'\nThis is PERMANENT and cannot be undone.':'\nThey will be logged out and unable to use SkillZea.')))return;
  if(prompt('Final check: type '+word+' to confirm')!==word)return toast('Cancelled - nothing changed')}
 const{error}=await sb.from('profiles').update({status:st}).eq('id',id);error?toast(error.message):(toast('Done'),adminView('users'))}
function userRows(q){q=(q||'').toLowerCase();
 $('#ur').innerHTML=A.p.filter(s=>[s.name,s.college,s.course,s.phone,s.email].join(' ').toLowerCase().includes(q)).map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.college)}<br><small class=mut>${esc(s.course)}</small></td><td>${esc(s.phone)}<br><small class=mut>${esc(s.email)}</small></td><td>${A.c.filter(x=>x.user_id===s.id).map(x=>`${cvLink(x)}${x.ats_score!=null?` <span class=pill>${x.ats_score}</span>`:''}`).join('<br>')||'<span class=mut>none</span>'}</td><td>${A.a.filter(x=>x.user_id===s.id).map(x=>esc(x.opportunities?.title)).join('<br>')||'<span class=mut>none</span>'}</td><td>${statusCell(s)}</td></tr>`).join('')||'<tr><td colspan=6 class=mut>No students found.</td></tr>'}
function exportCsv(){const e=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 const rows=[['Name','College','Course','Phone','Email','CVs','Applications'],...A.p.map(s=>[s.name,s.college,s.course,s.phone,s.email,A.c.filter(x=>x.user_id===s.id).length,A.a.filter(x=>x.user_id===s.id).length])];
 const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(e).join(',')).join('\n')],{type:'text/csv'}));l.download='skillzea_students.csv';l.click()}
const done=(r,t)=>r.error?toast(r.error.message):(toast('Saved'),adminView(t));
async function addOpp(){const logo=await pub($('#lg').files[0]);done(await sb.from('opportunities').insert({title:v('ti'),company:v('co'),location:v('lo'),duration:v('du'),pay_type:v('pt'),logo_url:logo,apply_link:v('al')}),'opps')}
async function addBatch(){const cv=await pub($('#mc').files[0]);done(await sb.from('batches').insert({course_name:v('cn'),mentor_name:v('mn'),mentor_about:v('ma'),mentor_cv_url:cv,duration:v('cd'),price:v('cp'),start_date:v('sd')||null,form_link:v('fl')}),'batches')}
async function addUp(){done(await sb.from('updates').insert({text:v('ut')}),'ups')}
async function del(t,id,tab){if(confirm('Delete this?'))done(await sb.from(t).delete().eq('id',id),tab)}
boot();
</script></body></html>
